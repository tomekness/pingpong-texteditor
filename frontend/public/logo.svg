<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Paddle 1 (behind) — dark -->
  <g transform="translate(50,50) rotate(-45)">
    <rect x="-5" y="-2" width="10" height="30" rx="3" fill="#8B6233" stroke="#6B4A22" stroke-width="1.5"/>
    <circle cx="0" cy="-20" r="18" fill="#3B6FD4" stroke="#2A55B0" stroke-width="2"/>
    <circle cx="0" cy="-20" r="10" fill="none" stroke="#6A99E8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  </g>
  <!-- Paddle 2 (front) — red -->
  <g transform="translate(50,50) rotate(45)">
    <rect x="-5" y="-2" width="10" height="30" rx="3" fill="#8B6233" stroke="#6B4A22" stroke-width="1.5"/>
    <circle cx="0" cy="-20" r="18" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
    <circle cx="0" cy="-20" r="10" fill="none" stroke="#F1948A" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  </g>
  <!-- Ball -->
  <circle cx="50" cy="50" r="4" fill="white" stroke="#CCCCCC" stroke-width="1"/>
</svg>
