limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ws:10m;

server {
  listen 80;

  # Use Docker's internal DNS resolver so upstream IPs are re-resolved
  # dynamically after container restarts instead of being cached at startup.
  resolver 127.0.0.11 valid=10s;

  # WebSocket → Hocuspocus (internal)
  location /ws {
    limit_conn ws 10;
    set $upstream_hocuspocus hocuspocus;
    proxy_pass http://$upstream_hocuspocus:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # Export API → Next.js frontend (more specific than /api/ below)
  location /api/export/ {
    set $upstream_frontend frontend;
    proxy_pass http://$upstream_frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # REST API → Hocuspocus API port
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    client_max_body_size 10m;
    set $upstream_hocuspocus hocuspocus;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://$upstream_hocuspocus:1235;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Everything else → Next.js frontend
  location / {
    set $upstream_frontend frontend;
    proxy_pass http://$upstream_frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
