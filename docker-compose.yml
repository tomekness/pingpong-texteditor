services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "4750:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - hocuspocus

  hocuspocus:
    build: ./server
    restart: unless-stopped
    volumes:
      - pingpong_data:/data
    environment:
      - BRIDGE_URL=http://bridge:3002
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

  bridge:
    build: ./bridge
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - HOCUSPOCUS_URL=ws://hocuspocus:1234
      - BRIDGE_PORT=3002
    depends_on:
      - hocuspocus

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - PORT=3000
    depends_on:
      - hocuspocus

volumes:
  pingpong_data:
