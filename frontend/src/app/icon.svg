<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Paddle 1 (behind) — blue, rotated left -->
  <g transform="translate(16,16) rotate(-40)">
    <rect x="-2.5" y="0" width="5" height="11" rx="1.5" fill="#7B5530"/>
    <circle cx="0" cy="-7" r="8" fill="#3B6FD4"/>
    <line x1="-4" y1="-7" x2="4" y2="-7" stroke="#6A99E8" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="-11" x2="0" y2="-3" stroke="#6A99E8" stroke-width="1" opacity="0.7"/>
  </g>
  <!-- Paddle 2 (front) — red, rotated right -->
  <g transform="translate(16,16) rotate(40)">
    <rect x="-2.5" y="0" width="5" height="11" rx="1.5" fill="#7B5530"/>
    <circle cx="0" cy="-7" r="8" fill="#E74C3C"/>
    <line x1="-4" y1="-7" x2="4" y2="-7" stroke="#F1948A" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="-11" x2="0" y2="-3" stroke="#F1948A" stroke-width="1" opacity="0.7"/>
  </g>
  <!-- Ball -->
  <circle cx="16" cy="16" r="2.5" fill="white" stroke="#ddd" stroke-width="0.5"/>
</svg>
